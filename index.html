<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gujarat Royal Stay | Premium Hotel</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{background:#0f172a;color:#fff;}

/* NAV */
nav{
  position:fixed;
  width:100%;
  top:0;
  background:rgba(0,0,0,0.7);
  padding:15px;
  text-align:center;
  z-index:1000;
}
nav a{
  color:#fff;
  margin:0 15px;
  text-decoration:none;
  font-weight:bold;
}
nav a:hover{color:#f59e0b;}

/* HERO */
.hero{
  height:100vh;
  background:url('https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=1600') center/cover;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}
.hero h1{
  font-size:50px;
  background:rgba(0,0,0,0.6);
  padding:20px;
  border-radius:10px;
  animation:fade 2s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;}
}

section{padding:80px 20px;text-align:center;}
h2{margin-bottom:20px;color:#f59e0b;}

/* CARDS */
.grid{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  justify-content:center;
}
.card{
  background:#1e293b;
  width:280px;
  border-radius:15px;
  overflow:hidden;
  transition:0.3s;
}
.card:hover{
  transform:scale(1.05);
}
.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}
.card h3{padding:10px;}

/* BOOKING */
form{
  max-width:400px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}
input,button{
  padding:10px;
  border:none;
  border-radius:5px;
}
button{
  background:#f59e0b;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

/* CONTACT */
.contact{
  background:#020617;
}

/* FLOAT BUTTONS */
.whatsapp, .call{
  position:fixed;
  right:20px;
  padding:12px;
  border-radius:50%;
  color:white;
  font-size:20px;
}
.whatsapp{bottom:80px;background:green;}
.call{bottom:20px;background:blue;}

footer{
  background:black;
  text-align:center;
  padding:15px;
}
</style>

</head>

<body>

<nav>
  <a href="#">Home</a>
  <a href="#rooms">Rooms</a>
  <a href="#food">Food</a>
  <a href="#booking">Booking</a>
  <a href="#contact">Contact</a>
</nav>

<div class="hero">
  <h1>Welcome to Gujarat Royal Stay 🏨</h1>
</div>

<section id="rooms">
  <h2>Luxury Rooms</h2>
  <div class="grid">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?q=80&w=800">
      <h3>Deluxe Room</h3>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1590490360182-c33d57733427?q=80&w=800">
      <h3>Premium Room</h3>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?q=80&w=800">
      <h3>Suite Room</h3>
    </div>
  </div>
</section>

<section id="food">
  <h2>Our Food 🍽️</h2>
  <div class="grid">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?q=80&w=800">
      <h3>Paneer Tikka</h3>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?q=80&w=800">
      <h3>Gujarati Thali</h3>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092?q=80&w=800">
      <h3>Pizza</h3>
    </div>
  </div>
</section>

<section id="booking">
  <h2>Book Your Stay</h2>
  <form>
    <input type="text" placeholder="Your Name" required>
    <input type="date" required>
    <input type="number" placeholder="Guests" required>
    <button>Book Now</button>
  </form>
</section>

<section id="contact" class="contact">
  <h2>Contact</h2>
  <p>📍 Vadodara, Gujarat</p>
  <p>📞 +91 9875239595</p>
  <p>📧 rohitpriyank950@gmail.com</p>
</section>

<a href="https://wa.me/919875239595" class="whatsapp">💬</a>
<a href="tel:9875239595" class="call">📞</a>

<footer>
  <p>© 2026 Gujarat Royal Stay</p>
</footer>

</body>
</html>
